
name: Gerar APK Nexa Music

on:
  workflow_dispatch:
  push:
    paths:
      - 'NexaMusic-AndroidStudio.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extrair projeto
        run: |
          unzip -q NexaMusic-AndroidStudio.zip -d projeto
          PROJECT_FILE=$(find projeto -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Arquivo settings.gradle não encontrado!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaMusic-APK
          path: projeto/**/app/build/outputs/apk/debug/app-debug.apk
          
