name: Build Nexa Music - Catálogo Duplo

on:
  workflow_dispatch:
  push:
    paths:
      - 'NexaMusic-DuploCatalogo.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto Android
        run: |
          mkdir -p projeto
          unzip -q NexaMusic-DuploCatalogo.zip -d projeto

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          cd projeto
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaMusic-DuploCatalogo-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
