name: Build Nexa Music - Catálogo Duplo

on:
  workflow_dispatch:
  push:
    paths:
      - 'NexaMusic-DuploCatalogo.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unpack Android project
        run: |
          mkdir -p projeto
          unzip -q NexaMusic-DuploCatalogo.zip -d projeto
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          cd projeto
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NexaMusic-DuploCatalogo-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          
